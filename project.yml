name: iPadServe
options:
  bundleIdPrefix: com.engagendy
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: 1.2.0
  CURRENT_PROJECT_VERSION: 14
  DEVELOPMENT_TEAM: 7JM77223V5
targets:
  iPadServe:
    type: application
    platform: iOS
    sources:
      - path: iPadServe
    resources:
      - path: iPadServe/Resources/Assets.xcassets
      - path: iPadServe/Resources/PrivacyInfo.xcprivacy
      - path: iPadServe/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.iPadServe
        PRODUCT_NAME: HTML Serve
        INFOPLIST_FILE: iPadServe/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7JM77223V5
        SUPPORTS_MACCATALYST: false
    info:
      path: iPadServe/Resources/Info.plist
      properties:
        CFBundleDisplayName: HTML Serve
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLName: com.engagendy.iPadServe
            CFBundleURLSchemes:
              - htmlserve
        NSLocalNetworkUsageDescription: HTML Serve uses the local network only when you enable sharing, so people on the same Wi-Fi can open your projects.
        # A project's own HTML can ask for the camera or microphone, through a
        # file input or getUserMedia. iOS terminates the app outright if these
        # keys are missing when the web view opens the camera.
        NSCameraUsageDescription: A project page you open can ask to use the camera, for example to take a photo or use a video stream. HTML Serve never uses the camera on its own.
        NSMicrophoneUsageDescription: A project page you open can ask to use the microphone, for example to record audio. HTML Serve never uses the microphone on its own.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
  iPadServeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iPadServeUITests
    dependencies:
      - target: iPadServe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.iPadServeUITests
        PRODUCT_NAME: HTML Serve UI Tests
        TEST_TARGET_NAME: iPadServe
        DEVELOPMENT_TEAM: 7JM77223V5
        GENERATE_INFOPLIST_FILE: true
